<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2a41">
<title>Raf Bul</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Raf Bul">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
:root{
  --bg:#f3f4f6; --card:#fff; --ink:#1b2a41; --mute:#667085; --line:#d9dde3;
  --sol:#2f5d9e; --sag:#1f8a70; --hi:#ffb300; --hi-ink:#1b1400; --danger:#c62828;
  --cell:#e8ebf0; --cell-ink:#44505f;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#10151d; --card:#1a222e; --ink:#eef1f5; --mute:#9aa6b6; --line:#2d3848;
  --sol:#5d93d8; --sag:#43b697; --cell:#263142; --cell-ink:#b5c0cf; --danger:#ef7b7b}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
header{background:#1b2a41;color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:20px;font-weight:800;letter-spacing:.2px}
header p{margin:2px 0 0;font-size:13px;opacity:.7}
main{padding:14px;max-width:560px;margin:0 auto}
.view{display:none}.view.on{display:block}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=search],select,textarea{width:100%;min-height:52px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card)}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--hi);outline-offset:1px}
label{display:block;font-weight:700;margin:14px 0 6px;font-size:15px}
label small{font-weight:400;color:var(--mute)}
.btn{min-height:52px;padding:0 18px;border:0;border-radius:12px;font-weight:700;background:var(--ink);color:var(--bg);cursor:pointer}
.btn.pri{background:var(--hi);color:var(--hi-ink)}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.del{background:transparent;border:2px solid var(--danger);color:var(--danger)}
.btn.full{width:100%}
.row{display:flex;gap:10px}.row>*{flex:1}
.card{background:var(--card);border-radius:16px;padding:14px;margin-top:12px;border:1px solid var(--line)}
.search{font-size:18px}
.empty{text-align:center;color:var(--mute);padding:26px 10px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}

/* Konum kartı */
.loc{border-radius:16px;padding:16px;margin-top:12px;background:var(--hi);color:var(--hi-ink)}
.loc .nm{font-weight:700;font-size:15px;opacity:.85}
.loc .big{font-size:34px;font-weight:900;letter-spacing:.5px;line-height:1.1;margin:4px 0 6px;word-spacing:2px}
.loc .sub{font-size:14px}

/* Sonuç listesi */
.res{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:8px;min-height:56px;cursor:pointer}
.res.sel{border-color:var(--hi);box-shadow:0 0 0 2px var(--hi)}
.res .t{font-weight:700}.res .c{font-size:13px;color:var(--mute)}
.chip{flex:none;font-weight:800;font-size:14px;padding:6px 10px;border-radius:8px;background:var(--cell);white-space:nowrap}

/* Raf şeması */
.map{margin-top:12px}
.side{border-radius:14px;padding:10px;margin-bottom:10px;color:#fff}
.side.sol{background:var(--sol)}.side.sag{background:var(--sag)}
.side h3{margin:0 0 8px;font-size:15px;font-weight:800}
.grid{display:grid;grid-template-columns:26px repeat(5,1fr);gap:5px;align-items:stretch}
.grid .h{font-size:12px;font-weight:700;text-align:center;align-self:center;opacity:.9}
.cell{min-height:44px;border:0;border-radius:8px;background:var(--cell);color:var(--cell-ink);font-weight:700;font-size:13px;position:relative;cursor:pointer;padding:0}
.cell .n{font-size:11px;font-weight:600;opacity:.8}
.cell.soft{background:#ffe29a;color:#3a2a00}
.cell.hi{background:var(--hi);color:var(--hi-ink);outline:3px solid #fff;animation:pulse 1.2s ease-in-out 3}
.cell.pick{background:var(--hi);color:var(--hi-ink);outline:3px solid #fff}
@keyframes pulse{50%{transform:scale(1.1)}}
@media (prefers-reduced-motion:reduce){.cell.hi{animation:none}}
.aisle{text-align:center;font-size:12px;color:var(--mute);margin:-2px 0 8px;letter-spacing:1px}

/* Seçici butonlar */
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:52px;min-height:52px;border:2px solid var(--line);background:var(--card);border-radius:12px;font-weight:800;cursor:pointer}
.seg button.on{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}

/* Alt menü */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
nav button{flex:1;min-height:56px;border:0;background:none;font-weight:700;font-size:13px;color:var(--mute);border-radius:12px;cursor:pointer}
nav button.on{color:var(--ink);background:var(--cell)}
nav span{display:block;font-size:22px;line-height:1.1}

/* Form paneli */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:10;overflow:auto;display:none;padding:calc(14px + env(safe-area-inset-top,0px)) 14px 40px}
.sheet.on{display:block}
.sheet .in{max-width:560px;margin:0 auto}
.sheet h2{margin:0 0 4px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.fab{position:fixed;right:16px;bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:7;width:62px;height:62px;border-radius:50%;border:0;background:var(--hi);color:var(--hi-ink);font-size:32px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer}
.hint{color:var(--mute);font-size:14px;margin:6px 0}
</style>
</head>
<body>
<header><h1>Raf Bul</h1><p>Ürün hangi rafta, hangi katta?</p></header>

<main>
  <!-- ARA -->
  <section id="v-ara" class="view on">
    <input id="q" class="search" type="search" placeholder="Ürün adı veya kodu yaz…" autocomplete="off" autocapitalize="off" enterkeyhint="search">
    <div id="out"></div>
    <div id="map1" class="map"></div>
  </section>

  <!-- ÜRÜNLER -->
  <section id="v-list" class="view">
    <input id="q2" type="search" placeholder="Listede ara…" autocomplete="off">
    <div id="count" class="hint"></div>
    <div id="plist"></div>
  </section>

  <!-- YEDEK -->
  <section id="v-yedek" class="view">
    <div class="card">
      <b>Verileri dışa aktar</b>
      <p class="hint">Tüm ürünleri JSON dosyası olarak telefona kaydeder.</p>
      <button class="btn full" id="exp">Dışa aktar (JSON)</button>
    </div>
    <div class="card">
      <b>Verileri içe aktar</b>
      <p class="hint">Daha önce aldığın JSON dosyasını seç. Mevcut ürünler bu dosyadakilerle değişir.</p>
      <input type="file" id="imp" accept=".json,application/json" hidden>
      <button class="btn full" id="impb">JSON dosyası seç</button>
    </div>
    <div class="card">
      <b>Örnek veriler</b>
      <p class="hint">Test için örnek ürünleri yükler. Mevcut ürünler silinir.</p>
      <button class="btn ghost full" id="demo">Örnek ürünleri yükle</button>
    </div>
  </section>
</main>

<button class="fab" id="add" aria-label="Ürün ekle">+</button>

<nav>
  <button data-v="ara" class="on"><span>🔍</span>Ara</button>
  <button data-v="list"><span>📦</span>Ürünler</button>
  <button data-v="yedek"><span>💾</span>Yedek</button>
</nav>

<!-- EKLE / DÜZENLE -->
<div class="sheet" id="sheet"><div class="in">
  <h2 id="ftitle">Ürün ekle</h2>
  <label for="f-name">Ürün adı</label>
  <input id="f-name" type="text" autocomplete="off">
  <label for="f-code">Ürün kodu <small>(isteğe bağlı)</small></label>
  <input id="f-code" type="text" autocomplete="off" autocapitalize="characters">
  <label for="f-cat">Kategori</label>
  <input id="f-cat" type="text" list="cats" autocomplete="off">
  <datalist id="cats"></datalist>

  <label>Raf tarafı</label>
  <div class="seg" id="s-side"><button data-v="SOL">SOL</button><button data-v="SAĞ">SAĞ</button></div>
  <label>Raf sırası</label>
  <div class="seg" id="s-sira"></div>
  <label>Kat <small>(K1 en alt, K4 en üst)</small></label>
  <div class="seg" id="s-kat"></div>

  <label for="f-goz">Raf gözü / bölme <small>(isteğe bağlı, örn. G4)</small></label>
  <input id="f-goz" type="text" autocomplete="off" autocapitalize="characters">
  <label for="f-desc">Açıklama <small>(isteğe bağlı)</small></label>
  <textarea id="f-desc"></textarea>

  <div class="hint" id="f-preview" style="margin-top:14px;font-weight:700"></div>
  <div class="row" style="margin-top:12px">
    <button class="btn ghost" id="f-cancel">Vazgeç</button>
    <button class="btn pri" id="f-save">Kaydet</button>
  </div>
  <button class="btn del full" id="f-del" style="margin-top:12px;display:none">Ürünü sil</button>
</div></div>

<div class="toast" id="toast"></div>

<script>
(function(){
const KEY='rafbul_urunler_v1';
const SIDES=['SOL','SAĞ'], SIRA=[1,2,3,4,5], KAT=[4,3,2,1];
const $=s=>document.querySelector(s);
const tr=s=>(s||'').toLocaleLowerCase('tr').trim();

const DEMO=[
 ['Çekiç 500 g','HRD-001','El aletleri','SOL',1,4,'G1','Ahşap saplı'],
 ['Tornavida seti','HRD-014','El aletleri','SOL',1,2,'G3','12 parça'],
 ['Matkap ucu seti','HRD-022','Elektrikli aletler','SOL',2,3,'G4','Beton ve ahşap uçlar'],
 ['Pil AA 4\'lü','ELK-110','Elektrik','SOL',3,1,'G2',''],
 ['LED ampul 9W','ELK-205','Elektrik','SOL',3,4,'G1','E27 duy'],
 ['Uzatma kablosu 5 m','ELK-310','Elektrik','SOL',4,2,'G5','4\'lü priz'],
 ['Boya fırçası 3"','BYA-040','Boya','SOL',5,3,'G2',''],
 ['İç cephe boyası beyaz 15 L','BYA-101','Boya','SAĞ',1,1,'G1','Mat'],
 ['Rulo seti','BYA-055','Boya','SAĞ',1,3,'G2',''],
 ['Silikon şeffaf','YPK-012','Yapıştırıcı','SAĞ',2,4,'G3','280 ml'],
 ['Çok amaçlı yapıştırıcı','YPK-030','Yapıştırıcı','SAĞ',2,2,'G1',''],
 ['Vida seti 200\'lü','BAĞ-007','Bağlantı','SAĞ',3,2,'G6','Karışık boy'],
 ['Dübel 8 mm','BAĞ-015','Bağlantı','SAĞ',3,3,'G4','100 adet'],
 ['Eldiven iş','GVN-002','İş güvenliği','SAĞ',4,4,'G2','L beden'],
 ['Baret sarı','GVN-010','İş güvenliği','SAĞ',5,1,'G1',''],
 ['Çöp poşeti büyük','TMZ-021','Temizlik','SAĞ',5,3,'G3','10\'lu rulo']
].map((a,i)=>({id:'d'+i,ad:a[0],kod:a[1],kat:a[2],taraf:a[3],sira:a[4],kata:a[5],goz:a[6],aciklama:a[7]}));

let items=load(), sel=null, form={taraf:'SOL',sira:1,kat:1}, editId=null;

function load(){
  try{const r=localStorage.getItem(KEY); if(r!==null) return JSON.parse(r)||[];}catch(e){}
  return DEMO.map(x=>({...x}));
}
function save(){ try{localStorage.setItem(KEY,JSON.stringify(items));}catch(e){toast('Kayıt yapılamadı. Tarayıcı depolaması kapalı olabilir.');} }
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2400);}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function locText(p,withGoz=true){return `${p.taraf} – S${p.sira} – K${p.kata}`+(withGoz&&p.goz?` – ${p.goz}`:'');}
function uid(){return 'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

/* ---------- Raf şeması ---------- */
function renderMap(el,{hi=null,soft=[],pick=null,onPick=null,counts=false}={}){
  let h='';
  SIDES.forEach(side=>{
    h+=`<div class="side ${side==='SOL'?'sol':'sag'}"><h3>${side} TARAF</h3><div class="grid"><span></span>`;
    SIRA.forEach(s=>h+=`<span class="h">S${s}</span>`);
    KAT.forEach(k=>{
      h+=`<span class="h">K${k}</span>`;
      SIRA.forEach(s=>{
        const key=side+'|'+s+'|'+k;
        let cls='cell';
        if(hi===key) cls+=' hi'; else if(pick===key) cls+=' pick'; else if(soft.includes(key)) cls+=' soft';
        const n=counts?items.filter(p=>p.taraf===side&&p.sira===s&&p.kata===k).length:0;
        h+=`<button class="${cls}" data-k="${key}" aria-label="${side} S${s} K${k}">${n?`<span class="n">${n}</span>`:''}</button>`;
      });
    });
    h+='</div></div>';
    if(side==='SOL') h+='<div class="aisle">— KORİDOR —</div>';
  });
  el.innerHTML=h;
  if(onPick) el.querySelectorAll('.cell').forEach(b=>b.onclick=()=>onPick(b.dataset.k));
}
const keyOf=p=>p.taraf+'|'+p.sira+'|'+p.kata;

/* ---------- Arama ---------- */
let tapKey=null;
function search(){
  const q=tr($('#q').value), out=$('#out');
  if(!q){
    sel=null; tapKey=null; out.innerHTML=items.length?'<div class="empty"><b>Ne arıyorsun?</b>Ürün adını veya kodunu yaz.</div>':'<div class="empty"><b>Henüz ürün yok</b>Sağ alttaki + ile ürün ekle.</div>';
    renderMap($('#map1'),{counts:true,onPick:showCell}); return;
  }
  const res=items.filter(p=>tr(p.ad).includes(q)||tr(p.kod).includes(q));
  if(!res.length){
    sel=null; out.innerHTML=`<div class="empty"><b>Ürün bulunamadı</b>“${esc($('#q').value.trim())}” için sonuç yok. Yazımı kontrol et ya da ürünü ekle.</div>`;
    renderMap($('#map1'),{counts:true,onPick:showCell}); return;
  }
  if(!sel||!res.some(p=>p.id===sel)) sel=res[0].id;
  paintResults(res);
}
function paintResults(res){
  const p=items.find(x=>x.id===sel), out=$('#out');
  let h=p?`<div class="loc"><div class="nm">${esc(p.ad)}${p.kod?' · '+esc(p.kod):''}</div>
    <div class="big">${esc(locText(p))}</div>
    <div class="sub">${esc(p.kat)}${p.aciklama?' — '+esc(p.aciklama):''}</div></div>`:'';
  if(res.length>1||!p){
    h+=res.map(r=>`<button class="res ${r.id===sel?'sel':''}" data-id="${r.id}"><span><span class="t">${esc(r.ad)}</span><br><span class="c">${esc(r.kod||r.kat)}</span></span><span class="chip">${esc(locText(r,false))}</span></button>`).join('');
  }
  out.innerHTML=h;
  out.querySelectorAll('.res').forEach(b=>b.onclick=()=>{sel=b.dataset.id;paintResults(res);window.scrollTo({top:0,behavior:'smooth'});});
  renderMap($('#map1'),{hi:p?keyOf(p):null,soft:res.filter(r=>r.id!==sel).map(keyOf),counts:false});
}
function showCell(key){
  const [t,s,k]=key.split('|'); const here=items.filter(p=>p.taraf===t&&p.sira==s&&p.kata==k);
  $('#out').innerHTML=`<div class="card"><b>${t} – S${s} – K${k}</b>`+(here.length?here.map(p=>`<div class="res" style="cursor:default"><span><span class="t">${esc(p.ad)}</span><br><span class="c">${esc(p.kod||p.kat)}</span></span><span class="chip">${esc(p.goz||'—')}</span></div>`).join(''):'<p class="hint">Bu rafta kayıtlı ürün yok.</p>')+'</div>';
  renderMap($('#map1'),{hi:key,counts:true,onPick:showCell});
}

/* ---------- Ürün listesi ---------- */
function renderList(){
  const q=tr($('#q2').value);
  const list=items.filter(p=>!q||tr(p.ad).includes(q)||tr(p.kod).includes(q)||tr(p.kat).includes(q))
    .sort((a,b)=>a.ad.localeCompare(b.ad,'tr'));
  $('#count').textContent=`${list.length} ürün`;
  $('#plist').innerHTML=list.length?list.map(p=>`<button class="res" data-id="${p.id}"><span><span class="t">${esc(p.ad)}</span><br><span class="c">${esc(p.kod?p.kod+' · ':'')}${esc(p.kat)}</span></span><span class="chip">${esc(locText(p))}</span></button>`).join(''):'<div class="empty"><b>Ürün yok</b>Ürün eklemek için + düğmesine bas.</div>';
  $('#plist').querySelectorAll('.res').forEach(b=>b.onclick=()=>openForm(b.dataset.id));
  $('#cats').innerHTML=[...new Set(items.map(p=>p.kat).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'tr')).map(c=>`<option value="${esc(c)}">`).join('');
}

/* ---------- Form ---------- */
function segs(){
  $('#s-sira').innerHTML=SIRA.map(s=>`<button data-v="${s}">S${s}</button>`).join('');
  $('#s-kat').innerHTML=KAT.slice().reverse().map(k=>`<button data-v="${k}">K${k}</button>`).join('');
  [['#s-side','taraf',v=>v],['#s-sira','sira',Number],['#s-kat','kat',Number]].forEach(([sel,key,cv])=>{
    $(sel).querySelectorAll('button').forEach(b=>b.onclick=()=>{form[key]=cv(b.dataset.v);syncSegs();});
  });
}
function syncSegs(){
  $('#s-side').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===form.taraf));
  $('#s-sira').querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.v===form.sira));
  $('#s-kat').querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.v===form.kat));
  $('#f-preview').textContent='Konum: '+form.taraf+' – S'+form.sira+' – K'+form.kat+($('#f-goz').value.trim()?' – '+$('#f-goz').value.trim().toUpperCase():'');
}
function openForm(id){
  editId=id||null;
  const p=id?items.find(x=>x.id===id):null;
  $('#ftitle').textContent=p?'Ürünü düzenle':'Ürün ekle';
  $('#f-name').value=p?p.ad:''; $('#f-code').value=p?p.kod:''; $('#f-cat').value=p?p.kat:'';
  $('#f-goz').value=p?p.goz:''; $('#f-desc').value=p?p.aciklama:'';
  form=p?{taraf:p.taraf,sira:p.sira,kat:p.kata}:{taraf:'SOL',sira:1,kat:1};
  $('#f-del').style.display=p?'block':'none';
  syncSegs(); $('#sheet').classList.add('on'); $('#sheet').scrollTop=0;
  if(!p) setTimeout(()=>$('#f-name').focus(),50);
}
function closeForm(){$('#sheet').classList.remove('on');}
$('#f-goz').oninput=syncSegs;
$('#f-cancel').onclick=closeForm;
$('#add').onclick=()=>openForm();
$('#f-save').onclick=()=>{
  const ad=$('#f-name').value.trim(), kat=$('#f-cat').value.trim();
  if(!ad){toast('Ürün adını yaz.');$('#f-name').focus();return;}
  if(!kat){toast('Kategori yaz.');$('#f-cat').focus();return;}
  const rec={ad,kod:$('#f-code').value.trim().toUpperCase(),kat,taraf:form.taraf,sira:form.sira,kata:form.kat,goz:$('#f-goz').value.trim().toUpperCase(),aciklama:$('#f-desc').value.trim()};
  if(editId){const i=items.findIndex(x=>x.id===editId);items[i]={...items[i],...rec};toast('Ürün güncellendi');}
  else{rec.id=uid();items.push(rec);sel=rec.id;toast('Ürün eklendi');}
  save(); closeForm(); renderList(); search();
};
$('#f-del').onclick=()=>{
  const p=items.find(x=>x.id===editId); if(!p) return;
  if(confirm(`“${p.ad}” silinsin mi?`)){items=items.filter(x=>x.id!==editId);save();closeForm();renderList();search();toast('Ürün silindi');}
};

/* ---------- Yedek ---------- */
$('#exp').onclick=()=>{
  const blob=new Blob([JSON.stringify({surum:1,tarih:new Date().toISOString(),urunler:items},null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='raf-bul-yedek-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast('Yedek dosyası hazırlandı');
};
$('#impb').onclick=()=>$('#imp').click();
$('#imp').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result), arr=Array.isArray(d)?d:d.urunler;
      if(!Array.isArray(arr)) throw 0;
      const clean=arr.filter(p=>p&&p.ad&&SIDES.includes(p.taraf)&&SIRA.includes(+p.sira)&&[1,2,3,4].includes(+p.kata)).map(p=>({id:p.id||uid(),ad:String(p.ad),kod:String(p.kod||''),kat:String(p.kat||'Genel'),taraf:p.taraf,sira:+p.sira,kata:+p.kata,goz:String(p.goz||''),aciklama:String(p.aciklama||'')}));
      if(!clean.length){toast('Dosyada geçerli ürün yok.');return;}
      if(!confirm(`${clean.length} ürün yüklenecek. Mevcut ürünler silinecek. Devam edilsin mi?`)) return;
      items=clean; save(); renderList(); search(); toast(clean.length+' ürün yüklendi');
    }catch(err){toast('Dosya okunamadı. Geçerli bir yedek JSON seç.');}
    e.target.value='';
  };
  r.readAsText(f);
};
$('#demo').onclick=()=>{ if(confirm('Mevcut ürünler silinip örnek ürünler yüklensin mi?')){items=DEMO.map(x=>({...x}));save();renderList();search();toast('Örnek ürünler yüklendi');} };

/* ---------- Gezinme ---------- */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+b.dataset.v));
  $('#add').style.display=b.dataset.v==='yedek'?'none':'block';
  if(b.dataset.v==='list') renderList();
  window.scrollTo(0,0);
});
$('#q').oninput=search; $('#q2').oninput=renderList;

segs(); renderList(); search();
try{ if(localStorage.getItem(KEY)===null) save(); }catch(e){}
})();
</script>
